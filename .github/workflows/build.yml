name: Build desktop app

# Builds the desktop shell for Windows and macOS, and attaches the resulting
# installers to the run.
#
# macOS builds MUST happen on macOS: electron-builder refuses to cross-build a .app
# from Windows or Linux, and code signing is macOS-only. Hence one job per platform
# in the matrix rather than a single cross-building job.
#
# Trigger by pushing a tag (creates a Release with the artifacts) or manually from the
# Actions tab (artifacts only).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # Runner labels verified against actions/runner-images:
          #   macOS arm64 -> macos-14 / macos-15 / macos-latest
          #   macOS Intel -> macos-15-intel (macos-13 is retired; macos-14 Intel is deprecated)
          - name: macOS (Apple Silicon)
            os: macos-14
            args: --mac dmg zip --arm64
            artifact: macos-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac dmg zip --x64
            artifact: macos-x64
          - name: Windows
            os: windows-latest
            args: --win nsis portable
            artifact: windows-x64

    steps:
      # Action majors are pinned to the releases that run on the runner's current
      # Node runtime. Older majors (checkout@v4, upload-artifact@v4, setup-node@v4)
      # still execute on node20, which GitHub now warns about on every run.
      - uses: actions/checkout@v7

      # Node 24: electron@44 declares `engines.node >= 22.12.0`, and several
      # transitive dependencies (abbrev, brace-expansion) accept only 20 || >=22 or
      # newer. Pinning 24 keeps the build on a version every dependency supports and
      # silences the engine warnings older runtimes produced.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Electron's postinstall downloads a ~370 MB binary. `npm ci` can skip it under
      # npm's allow-scripts policy, so install it explicitly and fail loudly if the
      # binary is missing rather than producing a broken build.
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
        shell: bash

      # A colon inside an unquoted YAML scalar starts a mapping, so multi-line shell
      # snippets are always written as block scalars (`run: |`).
      - name: Verify Electron binary is present
        shell: bash
        run: |
          node -e "const p=require('electron');const fs=require('fs');if(!fs.existsSync(p))throw new Error('electron binary missing at '+p);console.log('electron binary OK')"

      # Generates assets/icon.ico + icon.png from the dsh favicon.
      #
      # The generator is PowerShell and it renders through headless Chrome, neither of
      # which is a safe assumption on a runner. The committed icons are what the build
      # actually uses; this step only refreshes them where the tooling exists, and is
      # allowed to fail so a missing renderer never blocks a release.
      - name: Regenerate icons (best effort)
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File build/make-icons.ps1 || echo "icon generation skipped"
          else
            echo "pwsh unavailable - using the committed icons in assets/"
          fi
        shell: bash
        continue-on-error: true

      # A quick sanity check that the sources parse before spending time packaging.
      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/server-host.js
          node --check src/settings.js
          node --check src/loading.js
          node --check build/verify-contract.js
        shell: bash

      # Unsigned by default. To sign and notarize, add the usual Apple secrets and the
      # signing env vars electron-builder reads (CSC_LINK / CSC_KEY_PASSWORD, plus
      # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for notarization).
      # macOS signing, when no Developer ID certificate is configured.
      #
      # electron-builder only takes its ad-hoc signing path when `identity` is
      # EXPLICITLY "-" (MacTargetHelper.js: `if (qualifier === "-")`). Left unset with
      # no certificate in the keychain, it logs a warning and SKIPS signing entirely,
      # leaving an unsealed bundle — which macOS reports as "the app is damaged and
      # can't be opened", and which `codesign --verify` below then rejects with
      # "code has no resources but signature indicates they must be present".
      #
      # An ad-hoc signature is not trusted by Gatekeeper, but it does seal the bundle
      # consistently, which is what makes the app launchable after the user clears the
      # quarantine flag.
      #
      # Skipped automatically once CSC_LINK is provided, so adding a real certificate
      # needs no workflow change.
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        shell: bash
        run: |
          set -eo pipefail

          # `${EXTRA[@]}` on an empty array is an unbound-variable error under
          # `set -u`, and macOS runners default to bash 3.2 where this bites even
          # with newer syntax. So build the argument list as a plain string instead.
          EXTRA=""
          if [ "${{ startsWith(matrix.os, 'macos') }}" = "true" ] && [ -z "${CSC_LINK:-}" ]; then
            echo "No CSC_LINK secret set: requesting an ad-hoc macOS signature."
            EXTRA="--config.mac.identity=-"
          elif [ "${{ startsWith(matrix.os, 'macos') }}" = "true" ]; then
            echo "CSC_LINK present: signing with the provided certificate."
          fi

          # shellcheck disable=SC2086
          npx electron-builder ${{ matrix.args }} --publish never $EXTRA

      # Prove the macOS bundle is sealed before shipping it. An unsealed or
      # wrongly-signed .app installs fine and then fails at launch with "the app is
      # damaged", which is unfixable from the user's side. Catch it here instead.
      - name: Verify macOS signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 3 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then echo "no .app bundle produced"; exit 1; fi
          echo "verifying: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- signature details ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n '1,25p'
          echo "--- hardened runtime / entitlements ---"
          codesign -d --entitlements - "$APP" 2>&1 | sed -n '1,40p' || true
          echo "--- Gatekeeper assessment (expected to be rejected: not notarized) ---"
          spctl --assess --type execute --verbose=4 "$APP" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          # Windows and macOS only: no Linux target is produced.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
