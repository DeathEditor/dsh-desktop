<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Strict policy: this page is static and needs no network at all. The splash
      logic lives in loading.js (script-src 'self') rather than inline, because an
      inline script would be blocked here - which is exactly what the policy is for.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #18181b; color: #e6e6e9;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        display: flex; align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none;
      }
      .wrap { text-align: center; }
      .mark { width: 96px; height: 96px; margin-bottom: 22px; opacity: .95; }
      .title { font-size: 15px; letter-spacing: .2px; }
      .status { margin-top: 10px; font-size: 12.5px; color: #9a9aa2; min-height: 18px; }
      .bar {
        margin: 20px auto 0; width: 190px; height: 3px; border-radius: 3px;
        background: #2a2a30; overflow: hidden; position: relative;
      }
      .bar::after {
        content: ""; position: absolute; inset: 0; width: 40%;
        background: #4d6bfe; border-radius: 3px;
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { left: -40%; }
        100% { left: 100%; }
      }
      .hint { margin-top: 18px; font-size: 11.5px; color: #6e6e78; }
      @media (prefers-reduced-motion: reduce) {
        .bar::after { animation: none; left: 30%; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- The official DeepSeek Harness whale mark, inlined so the splash needs no I/O. -->
      <svg class="mark" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#FFFFFF" id="whale" d="" />
      </svg>
      <div class="title">DeepSeek Harness</div>
      <div class="status" id="status">Starting the local server…</div>
      <div class="bar"></div>
      <div class="hint">First launch can take a few seconds.</div>
    </div>
    <script src="./loading.js"></script>
  </body>
</html>
